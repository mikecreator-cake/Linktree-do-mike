<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links do Mike</title>
    <style>
        /* Estilo geral da página */
        body {
            background-color: #121212; /* Fundo escuro moderno */
            color: #ffffff; /* Texto branco */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        /* Área do Perfil (Foto e Nome) */
        .perfil {
            text-align: center;
            margin-bottom: 30px;
        }

        .perfil img {
            width: 110px;
            height: 110px;
            border-radius: 50%; /* Deixa a foto perfeitamente redonda */
            border: 3px solid #ffdb4d; /* Borda amarela na cor do Piu Piu */
            object-fit: cover;
        }

        .perfil h1 {
            font-size: 26px;
            margin: 15px 0 5px 0;
            letter-spacing: 0.5px;
        }

        .perfil p {
            font-size: 14px;
            color: #aaaaaa;
            margin: 0;
        }

        /* Container dos botões */
        .links-container {
            width: 100%;
            max-width: 400px; /* Mantém um tamanho bom no telemóvel e no PC */
        }

        /* Estilo dos Botões */
        .link-botao {
            display: block;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #333333;
            box-sizing: border-box;
            transition: all 0.3s ease; /* Efeito suave */
        }

        /* Efeito ao passar o rato ou tocar no botão */
        .link-botao:hover {
            background-color: #ffdb4d; /* Fica amarelo */
            color: #121212; /* Texto fica escuro para dar contraste */
            transform: translateY(-2px); /* Dá uma leve subidinha */
            box-shadow: 0 5px 15px rgba(255, 219, 77, 0.2); /* Brilho amarelo no fundo */
        }
    </style>
</head>
<body>

    <div class="perfil">
        <img src="https://i.pinimg.com/736x/59/cc/62/59cc627dfb38b707421314979e2c67bc.jpg" alt="Foto de Perfil do Mike">
        <h1>Mike</h1>
        <p>@Shirowkk</p>
    </div>

    <div class="links-container">
        <a href="https://www.youtube.com/@Shirowkk" target="_blank" class="link-botao">Meu Canal no YouTube</a>
        
        <a href="#" target="_blank" class="link-botao">Comunidade</a>
        <a href="#" target="_blank" class="link-botao">Null's Brawl</a>
        <a href="#" target="_blank" class="link-botao">GitHub</a>
    </div>

</body>
</html>

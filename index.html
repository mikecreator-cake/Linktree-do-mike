<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links do Mike</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .perfil {
            text-align: center;
            margin-bottom: 30px;
        }

        .perfil img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ffdb4d;
            object-fit: cover;
        }

        .perfil h1 {
            font-size: 26px;
            margin: 15px 0 5px 0;
            letter-spacing: 0.5px;
        }

        .perfil p {
            font-size: 14px;
            color: #aaaaaa;
            margin: 0;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
        }

        .link-botao {
            display: block;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #333333;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .link-botao:hover {
            background-color: #ffdb4d;
            color: #121212;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 219, 77, 0.2);
        }
    </style>
</head>
<body>

    <div class="perfil">
        <img src="https://i.imgur.com/83uXmSn.png" alt="Foto de Perfil do Mike">
        <h1>Mike</h1>
        <p>@Shirowkk</p>
    </div>

    <div class="links-container">
        <a href="https://www.youtube.com/@Shirowkk" target="_blank" class="link-botao">Meu Canal no YouTube</a>
        <a href="#" target="_blank" class="link-botao">Comunidade</a>
        <a href="#" target="_blank" class="link-botao">GitHub</a>
    </div>

</body>
</html>
